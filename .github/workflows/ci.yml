name: CI

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest
    outputs:
      simulator_udid: ${{ steps.select-simulator.outputs.udid }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated schemes
        run: xcodebuild -list -project focus.xcodeproj

      - name: Select available iPhone Simulator
        id: select-simulator
        run: |
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] | first | .udid // empty')"

          if [ -z "$SIMULATOR_UDID" ]; then
            echo "No available iPhone Simulator found"
            xcrun simctl list devices available
            exit 1
          fi

          echo "Selected simulator: $SIMULATOR_UDID"
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.select-simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.select-simulator.outputs.udid }}" -b

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild \
            -project focus.xcodeproj \
            -scheme focus \
            -destination "platform=iOS Simulator,id=${{ steps.select-simulator.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            build-for-testing 2>&1 | tee build/build-for-testing.log

      - name: Upload build log (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build-for-testing.log
          retention-days: 5

      - name: Extract compile errors as annotations
        if: always()
        run: |
          if [ -f build/build-for-testing.log ]; then
            grep -E "error:" build/build-for-testing.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Run unit and integration tests
        run: |
          xcodebuild \
            -project focus.xcodeproj \
            -scheme focus \
            -destination "platform=iOS Simulator,id=${{ steps.select-simulator.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            test-without-building 2>&1 | tee build/test.log

      - name: Upload test log (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: build/test.log
          retention-days: 5

  build-unsigned-ipa:
    runs-on: macos-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated schemes
        run: xcodebuild -list -project focus.xcodeproj

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project focus.xcodeproj \
            -scheme focus \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/focus.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/archive.log

      - name: Upload archive log (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: build/archive.log
          retention-days: 5

      - name: Extract archive errors as annotations
        if: always()
        run: |
          if [ -f build/archive.log ]; then
            grep -E "error:" build/archive.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/focus.xcarchive/Products/Applications/focus.app build/Payload/
          cd build
          zip -r focus-unsigned.ipa Payload/
          cd ..

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-unsigned-ipa
          path: build/focus-unsigned.ipa
          retention-days: 30