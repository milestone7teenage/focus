name: CI

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest
    outputs:
      simulator_udid: ${{ steps.select-simulator.outputs.udid }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated schemes
        run: xcodebuild -list -project focus.xcodeproj

      - name: Select available iPhone Simulator
        id: select-simulator
        run: |
          # Get list of available iPhone simulators
          DEVICES_JSON=$(xcrun simctl list devices available -j)
          UDID=$(echo "$DEVICES_JSON" | python3 -c "
import sys, json
data = json.load(sys.stdin)
for runtime, devices in data.get('devices', {}).items():
    if 'iOS' in runtime or 'iPhoneOS' in runtime:
        for d in devices:
            if d.get('isAvailable', False) and 'iPhone' in d.get('name', ''):
                print(d['udid'])
                sys.exit(0)
sys.exit(1)
")
          if [ -z "$UDID" ]; then
            echo "No available iPhone Simulator found"
            echo "$DEVICES_JSON" | python3 -c "
import sys, json
data = json.load(sys.stdin)
for runtime, devices in data.get('devices', {}).items():
    for d in devices:
        print(f\"  {d.get('name', 'unknown')} ({runtime}): available={d.get('isAvailable', False)}, state={d.get('state', 'unknown')}\")
"
            exit 1
          fi
          echo "Selected simulator: $UDID"
          echo "udid=$UDID" >> $GITHUB_OUTPUT

      - name: Build for testing
        run: |
          xcodebuild \
            -project focus.xcodeproj \
            -scheme focus \
            -destination "platform=iOS Simulator,id=${{ steps.select-simulator.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            build-for-testing

      - name: Run unit and integration tests
        run: |
          xcodebuild \
            -project focus.xcodeproj \
            -scheme focus \
            -destination "platform=iOS Simulator,id=${{ steps.select-simulator.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            test-without-building

  build-unsigned-ipa:
    runs-on: macos-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated schemes
        run: xcodebuild -list -project focus.xcodeproj

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project focus.xcodeproj \
            -scheme focus \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/focus.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/focus.xcarchive/Products/Applications/focus.app build/Payload/
          cd build
          zip -r focus-unsigned.ipa Payload/
          cd ..

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-unsigned-ipa
          path: build/focus-unsigned.ipa
          retention-days: 30