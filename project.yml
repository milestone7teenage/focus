name: focus

options:
  bundleIdPrefix: com.placeholder
  deploymentTarget:
    iOS: 17.0

packages: {}

targets:
  focus:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        includes:
          - FocusApp.swift
      - path: Features
        includes:
          - ContentView.swift
          - TaskCard/TaskCard.swift
          - TaskCard/TaskItemModels.swift
          - TaskEditor/TaskEditor.swift
          - UndoBanner/UndoBanner.swift
          - OneTimeTasks/OneTimeTasksView.swift
          - OneTimeTasks/OneTimeTasksViewModel.swift
          - RecurringTasks/RecurringTasksView.swift
          - RecurringTasks/RecurringTasksViewModel.swift
      - path: Domain
        includes:
          - ReminderState.swift
          - CalendarPolicy.swift
          - TaskSnapshot.swift
          - SchemaV1.swift
      - path: Data
        includes:
          - OneTimeTask.swift
          - RegularTaskTemplate.swift
          - DailyTaskInstance.swift
          - TaskRepository.swift
      - path: Services
        includes:
          - Scheduling.swift
          - UndoService.swift
          - TaskManager.swift
          - ScheduleEngine.swift
          - AppLifecycleProvider.swift
          - NotificationCenterAdapter.swift
          - RealNotificationCenterAdapter.swift
          - NotificationScheduler.swift
          - NotificationActionHandler.swift
          - AppLifecycleCoordinator.swift
          - AppDelegate.swift
      - path: Design
        includes:
          - DesignSystem.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.teal5991.labradorite7249
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO

  focusTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        includes:
          - FocusTests.swift
          - TaskManagerTests.swift
          - UndoServiceTests.swift
          - ScheduleEngineTests.swift
          - NotificationSchedulerTests.swift
          - IntegrationTests.swift
          - FakeNotificationCenterAdapter.swift
          - TestHelpers.swift
    dependencies:
      - target: focus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.teal5991.labradorite7249.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO

schemes:
  focus:
    build:
      targets:
        focus: all
    test:
      targets:
        - focusTests
      gatherCoverageData: false